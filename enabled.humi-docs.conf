server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;

    # TLS ends at the ingress, so keep redirects relative instead of
    # pointing them at http://.
    absolute_redirect off;

    location = /docs {
        return 301 /docs/;
    }

    # cleanUrls: /docs/guide/introduction is served from introduction.html.
    location /docs/ {
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /docs/404.html;
    }

    # Built assets have content hashes in their names.
    location /docs/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
